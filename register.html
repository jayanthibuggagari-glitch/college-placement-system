
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration | CareerConnect</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f5f9;
    color: #17243b;
}

header {
    background: #071b3a;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #e8b94f;
    font-size: 25px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover,
nav a.active {
    color: #e8b94f;
}

.hero {
    background: linear-gradient(120deg, #071b3a, #173e70);
    text-align: center;
    padding: 45px 15px;
    color: white;
}

.hero h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.hero p {
    color: #dce5f2;
}

.container {
    max-width: 850px;
    width: 92%;
    margin: 40px auto;
}

.form-card {
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 22px rgba(0,0,0,0.08);
}

.form-card h2 {
    color: #102d53;
    margin-bottom: 25px;
    border-bottom: 2px solid #e8b94f;
    padding-bottom: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5dce6;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: #d9a52e;
}

.register-btn {
    width: 100%;
    padding: 15px;
    background: #d9a52e;
    border: none;
    color: #071b3a;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
}

.register-btn:hover {
    background: #c28e16;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 6px;
    text-align: center;
    font-size: 14px;
}

.login-link {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
}

.login-link a {
    color: #b17b0b;
    font-weight: bold;
    text-decoration: none;
}

footer {
    background: #071b3a;
    color: white;
    text-align: center;
    padding: 22px;
    margin-top: 50px;
}

footer span {
    color: #e8b94f;
}

@media(max-width: 650px) {
    header {
        justify-content: center;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .form-card {
        padding: 23px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">CareerConnect</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="companies.html">Companies</a>
        <a href="students.html">Students</a>
        <a href="jobs.html">Jobs</a>
        <a href="applications.html">Applications</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="hero">
    <h1>Student Registration</h1>
    <p>Create your account and start your placement journey.</p>
</section>

<div class="container">

    <div class="form-card">

        <h2>Enter Your Details</h2>

        <form id="registerForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="roll_no"
                        placeholder="Enter your roll number" required>
                </div>

                <div class="form-group">
                    <label>Branch</label>
                    <select id="branch" required>
                        <option value="">Select Branch</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="IT">IT</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>
                        <option value="AIML">AI & ML</option>
                        <option value="DS">Data Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CGPA</label>
                    <input type="number" id="cgpa"
                        placeholder="Enter your CGPA"
                        min="0" max="10" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone"
                        placeholder="Enter 10 digit phone number"
                        pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group full">
                    <label>Password</label>
                    <input type="password" id="password"
                        placeholder="Create your password"
                        minlength="6" required>
                </div>

                <div class="form-group full">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword"
                        placeholder="Re-enter your password" required>
                </div>

            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <div class="message" id="message"></div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login Here</a>
        </div>

    </div>

</div>

<footer>
    <p>© 2026 <span>CareerConnect</span> | College Placement Management System</p>
</footer>

<script>
document.getElementById("registerForm").addEventListener("submit",
function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let rollNo = document.getElementById("roll_no").value.trim();
    let branch = document.getElementById("branch").value;
    let cgpa = Number(document.getElementById("cgpa").value);
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    let message = document.getElementById("message");

    message.style.display = "block";

    if (cgpa < 0 || cgpa > 10) {
        message.style.background = "#ffe0e0";
        message.style.color = "#b42323";
        message.textContent = "CGPA must be between 0 and 10.";
        return;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        message.style.background = "#ffe0e0";
        message.style.color = "#b42323";
        message.textContent = "Please enter a valid 10 digit phone number.";
        return;
    }

    if (password !== confirmPassword) {
        message.style.background = "#ffe0e0";
        message.style.color = "#b42323";
        message.textContent = "Passwords do not match.";
        return;
    }

    message.style.background = "#fff1cc";
    message.style.color = "#805b00";
    message.textContent =
        "Form validation successful! Backend connection is required to save your registration.";

});
</script>

</body>
</html>
